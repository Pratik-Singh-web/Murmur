- id: established_enterprise__receptive
  persona_id: established_enterprise
  behaviour: receptive
  simulated_seller: 'You are a seller on IndiaMART: Shree Balaji Packaging Pvt Ltd (Corrugated Box, Ahmedabad). Speak Hinglish,
    short replies. You are the owner. You are open to hearing more. Ask one simple question about what the meeting is, then
    agree to one of the offered times.'
  expected_outcome: meeting_fixed
  pass_criteria: &id001
  - Agent offers specific time options
  - Agent repeats the chosen time and gets explicit confirmation
  - Agent's turns are short (≤ 2 sentences)
  - Agent never invents numbers or prices
  variables:
    seller_glid: '900000010'
    persona_id: established_enterprise
    persona_label: Established enterprise
    voice_variant: formal
    language: Hindi
    agent_name: Aditya
    address: ji
    company: Shree Balaji Packaging Pvt Ltd
    category: Corrugated Box
    city: Ahmedabad
    tone: Respectful, concise, business-value first. Treat them as an experienced owner.
    formality: high
    pitch_cap_turns: '2'
    opener: Namaste ji, IndiaMART se Aditya. Shree Balaji Packaging Pvt Ltd ki Corrugated Box listing ke baare mein ek minute
      — kya abhi baat ho sakti hai?
    value_hook: aapki listing par jo enquiries aa rahi hain, unme se kaafi convert ho sakti hain — hamare account manager
      15 minute mein dikha denge kahan buyers chhoot rahe hain
    ask: Kya is hafte 15 minute ki meeting rakh lein? kal subah 11 baje ya kal shaam 4 baje, jo aapko suit kare.
    slot_1: kal subah 11 baje
    slot_2: kal shaam 4 baje
    avoid: long IndiaMART introduction; repeating the pitch after a no; casual words like 'bhai'
    attempt_no: '1'
    attempt_note: Normal persona opener.
    flag_note: ''
